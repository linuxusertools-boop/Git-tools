<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexu | GitHub Deployer Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --gh-blue: #0969da;
            --gh-bg: #f6f8fa;
            --gh-border: #d0d7de;
            --gh-danger: #cf222e;
            --gh-success: #1f883d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #ffffff; margin: 0; color: #1f2328;
        }

        .banner {
            background: #1b4b82 linear-gradient(135deg, #1b4b82 0%, #2b6cb0 100%);
            color: white; padding: 50px 20px; text-align: center; position: relative; overflow: hidden;
        }

        .banner-icon {
            background: white; width: 70px; height: 70px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; z-index: 2;
        }
        .banner-icon svg { fill: #1b4b82; width: 40px; }

        .container { max-width: 800px; margin: -35px auto 50px; padding: 0 20px; position: relative; z-index: 5; }

        .box {
            background: white; border: 1px solid var(--gh-border);
            border-radius: 6px; box-shadow: 0 8px 24px rgba(149,157,165,0.2);
        }

        .box-header {
            background: var(--gh-bg); padding: 16px; border-bottom: 1px solid var(--gh-border);
            font-weight: 600; border-radius: 6px 6px 0 0;
        }

        .box-body { padding: 24px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        
        input, select {
            width: 100%; padding: 10px; border: 1px solid var(--gh-border);
            border-radius: 6px; box-sizing: border-box; background: #fafafa;
        }

        .btn {
            padding: 10px 20px; font-weight: 600; border-radius: 6px; border: 1px solid rgba(0,0,0,0.1);
            cursor: pointer; width: 100%; transition: 0.2s;
        }

        .btn-primary { background: var(--gh-success); color: white; }
        .btn-danger { color: var(--gh-danger); background: var(--gh-bg); margin-top: 10px; border: 1px solid var(--gh-border); }
        .btn-danger:hover { background: var(--gh-danger); color: white; }

        #log {
            background: #0d1117; color: #7ee787; padding: 15px; border-radius: 6px;
            font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px;
            margin-top: 20px; height: 280px; overflow-y: auto; display: none; border: 1px solid #30363d;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="banner">
    <div class="banner-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.165 6.839 9.49.5.09.682-.218.682-.485 0-.24-.009-.875-.013-1.716-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.011 10.011 0 0022 12c0-5.523-4.477-10-10-10z"></path></svg>
    </div>
    <h1 style="margin:0; font-size: 32px;">GitHub Deployer Pro</h1>
    <p style="margin:8px 0 0; opacity: 0.8;">Cortex Engine by Nexu</p>
</div>

<div class="container">
    <div class="box">
        <div class="box-header">Deployment Console</div>
        <div class="box-body">
            <div id="step1">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
                <button class="btn btn-primary" style="margin-top:12px" onclick="connect()">Connect to GitHub</button>
            </div>

            <div id="step2" class="hidden">
                <div class="form-group">
                    <label>Pilih Repository</label>
                    <select id="repoList"></select>
                </div>
                <div class="form-group">
                    <label>Pilih File ZIP</label>
                    <input type="file" id="zipInput" accept=".zip">
                </div>
                <button class="btn btn-danger" id="deployBtn" onclick="startDeploy()">Wipe & Deploy Baru</button>
            </div>

            <div id="log"></div>
        </div>
    </div>
</div>

<script>
    let TOKEN = "";

    function writeLog(text, color = "#7ee787") {
        const logBox = document.getElementById('log');
        logBox.style.display = "block";
        const entry = document.createElement('div');
        entry.style.color = color;
        entry.style.marginBottom = "2px";
        entry.textContent = `> ${text}`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function getBase64(fileData) {
        return new Promise((resolve) => {
            const blob = new Blob([fileData]);
            const reader = new FileReader();
            reader.onload = (e) => resolve(window.btoa(e.target.result));
            reader.readAsBinaryString(blob);
        });
    }

    async function connect() {
        TOKEN = document.getElementById('token').value;
        if(!TOKEN) return alert("Token tidak boleh kosong!");
        
        try {
            const res = await fetch('https://api.github.com/user/repos?per_page=100&sort=updated', {
                headers: { 'Authorization': `token ${TOKEN}` }
            });
            if(!res.ok) throw new Error("Koneksi gagal. Cek validitas token Anda.");
            const repos = await res.json();
            document.getElementById('repoList').innerHTML = repos.map(r => `<option value="${r.full_name}">${r.full_name}</option>`).join('');
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            writeLog("GitHub terhubung. Siap melakukan deployment.", "#3fb950");
        } catch (e) { alert(e.message); }
    }

    async function startDeploy() {
        const repo = document.getElementById('repoList').value;
        const fileInput = document.getElementById('zipInput');
        const deployBtn = document.getElementById('deployBtn');
        const file = fileInput.files[0];
        
        if(!file) return alert("Silakan pilih file ZIP!");
        if(!confirm("⚠️ PERINGATAN: Seluruh file di branch utama akan DIHAPUS dan diganti dengan isi ZIP ini. Lanjutkan?")) return;

        deployBtn.disabled = true;
        deployBtn.textContent = "Deploying...";
        document.getElementById('log').innerHTML = ""; 

        try {
            writeLog("Memulai Nexu Engine...");

            // 1. Cek Branch Utama
            let branchName = "main";
            let branchRes = await fetch(`https://api.github.com/repos/${repo}/branches/main`, { headers: { 'Authorization': `token ${TOKEN}` }});
            if(!branchRes.ok) {
                branchRes = await fetch(`https://api.github.com/repos/${repo}/branches/master`, { headers: { 'Authorization': `token ${TOKEN}` }});
                branchName = "master";
            }
            if(!branchRes.ok) throw new Error("Branch utama tidak ditemukan.");
            
            const branchData = await branchRes.json();
            const parentSha = branchData.commit.sha;

            // 2. Load ZIP
            writeLog("Menganalisa struktur ZIP...");
            const zip = await JSZip.loadAsync(file);
            const allEntries = Object.keys(zip.files);
            const filesOnly = allEntries.filter(k => !zip.files[k].dir);

            if(filesOnly.length === 0) throw new Error("ZIP tidak mengandung file.");

            // LOGIKA STRIP FOLDER: Cek apakah semua file diawali folder yang sama (misal 'tes/')
            const firstParts = filesOnly.map(path => path.split('/')[0]);
            const isAllInSameFolder = firstParts.every(p => p === firstParts[0]) && filesOnly.every(path => path.includes('/'));
            
            if(isAllInSameFolder) writeLog(`Mendeteksi folder induk '${firstParts[0]}'. Melakukan path stripping...`, "#d29922");

            const treeItems = [];

            // 3. Upload ke GitHub Blobs
            for(const filename of filesOnly) {
                let githubPath = filename;
                
                // Jika semua di dalam folder 'tes/', buang 'tes/' agar file langsung ke root
                if(isAllInSameFolder) {
                    githubPath = filename.substring(filename.indexOf('/') + 1);
                }

                if(!githubPath) continue;

                writeLog(`Upload: ${githubPath}`);
                const content = await zip.files[filename].async("uint8array");
                const b64 = await getBase64(content);
                
                const blobRes = await fetch(`https://api.github.com/repos/${repo}/git/blobs`, {
                    method: 'POST',
                    headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: b64, encoding: 'base64' })
                });

                const blobData = await blobRes.json();
                if(!blobRes.ok) throw new Error(`Blob Error (${githubPath}): ${blobData.message}`);
                
                treeItems.push({
                    path: githubPath,
                    mode: "100644",
                    type: "blob",
                    sha: blobData.sha
                });
            }

            // 4. Create Tree (Clean Rebuild)
            writeLog("Membangun struktur file baru...");
            const treeRes = await fetch(`https://api.github.com/repos/${repo}/git/trees`, {
                method: 'POST',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ tree: treeItems })
            });
            const treeData = await treeRes.json();
            if(!treeRes.ok) throw new Error("Gagal membangun Tree.");

            // 5. Commit
            writeLog("Membuat commit...");
            const commitRes = await fetch(`https://api.github.com/repos/${repo}/git/commits`, {
                method: 'POST',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: "Nexu Clean Deploy: " + new Date().toLocaleString(),
                    tree: treeData.sha,
                    parents: [parentSha]
                })
            });
            const commitData = await commitRes.json();

            // 6. Push Update (Force)
            writeLog("Pushing ke branch " + branchName + "...");
            const refRes = await fetch(`https://api.github.com/repos/${repo}/git/refs/heads/${branchName}`, {
                method: 'PATCH',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ sha: commitData.sha, force: true })
            });

            if(!refRes.ok) throw new Error("Gagal melakukan update ref.");

            writeLog("🎉 DEPLOY BERHASIL!", "#3fb950");
            alert("Selesai! Repositori berhasil diperbarui.");

        } catch (e) {
            writeLog("ERROR: " + e.message, "#f85149");
            console.error(e);
        } finally {
            deployBtn.disabled = false;
            deployBtn.textContent = "Wipe & Deploy Baru";
        }
    }
</script>
</body>
</html>
