<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kev-git | GitHub Deployer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand">
                <svg height="20" viewBox="0 0 16 16" width="20">
                    <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82A7.41 7.41 0 0 0 8 4c-.68.005-1.35.093-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
                </svg>
                <h1>kev-git</h1>
            </div>
            <a href="https://kevsoft-id.developer.li" target="_blank" class="nav-link">Website ➔</a>
        </header>

        <main>
            <div id="step1">
                <div class="form-group">
                    <label>GitHub Personal Token</label>
                    <input type="password" id="token" placeholder="ghp_...">
                </div>
                <button class="btn" onclick="connect()">Connect Engine</button>
            </div>
            
            <div id="step2" class="hidden">
                <div class="form-group">
                    <label>Target Repository</label>
                    <select id="repoList"></select>
                </div>
                <div class="form-group">
                    <label>Source Bundle (ZIP)</label>
                    <input type="file" id="zipInput" accept=".zip">
                </div>
                <button class="btn" id="deployBtn" onclick="startDeploy()">Production Deploy</button>
            </div>
            
            <div id="log"></div>

            <div class="section-title">
                <span>Latest Used</span>
                <span class="clear-btn" onclick="clearHistory()">clear</span>
            </div>
            <div id="historyContainer">
                <div class="history-empty">No deployments logged.</div>
            </div>
        </main>

        <footer>
            powered by <a href="https://github.com/kevsoft-id" target="_blank">@kevsoft-id</a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
