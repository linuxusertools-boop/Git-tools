<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexu | GitHub Deployer Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --gh-blue: #0969da;
            --gh-bg: #f6f8fa;
            --gh-border: #d0d7de;
            --gh-danger: #cf222e;
            --gh-success: #1f883d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #ffffff; margin: 0; color: #1f2328;
        }
        .banner {
            background: #1b4b82 linear-gradient(135deg, #1b4b82 0%, #2b6cb0 100%);
            color: white; padding: 40px 20px; text-align: center; position: relative;
        }
        .container { max-width: 800px; margin: -30px auto 50px; padding: 0 20px; position: relative; }
        .box {
            background: white; border: 1px solid var(--gh-border);
            border-radius: 6px; box-shadow: 0 8px 24px rgba(149,157,165,0.2);
        }
        .box-header { background: var(--gh-bg); padding: 16px; border-bottom: 1px solid var(--gh-border); font-weight: 600; }
        .box-body { padding: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--gh-border); border-radius: 6px; box-sizing: border-box; }
        .btn { padding: 10px 20px; font-weight: 600; border-radius: 6px; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; width: 100%; }
        .btn-primary { background: var(--gh-success); color: white; }
        .btn-danger { color: var(--gh-danger); background: var(--gh-bg); margin-top: 10px; border: 1px solid var(--gh-border); }
        #log { background: #0d1117; color: #7ee787; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 12px; margin-top: 20px; height: 250px; overflow-y: auto; display: none; border: 1px solid #30363d; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="banner">
        <h1>GitHub Deployer Pro</h1>
        <p>Nexu Stable Engine v2.0</p>
    </div>
    <div class="container">
        <div class="box">
            <div class="box-header">Console Management</div>
            <div class="box-body">
                <div id="step1">
                    <label>Token GitHub (repo access)</label>
                    <input type="password" id="token" placeholder="ghp_...">
                    <button class="btn btn-primary" onclick="connect()">Connect</button>
                </div>
                <div id="step2" class="hidden">
                    <div class="form-group"><label>Repository</label><select id="repoList"></select></div>
                    <div class="form-group"><label>File ZIP</label><input type="file" id="zipInput" accept=".zip"></div>
                    <button class="btn btn-danger" id="deployBtn" onclick="startDeploy()">Deploy Now</button>
                </div>
                <div id="log"></div>
            </div>
        </div>
    </div>
    <script>
        let TOKEN = "";
        function writeLog(text, color = "#7ee787") {
            const l = document.getElementById('log'); l.style.display = "block";
            const e = document.createElement('div'); e.style.color = color; e.textContent = "> " + text;
            l.appendChild(e); l.scrollTop = l.scrollHeight;
        }
        async function getBase64(data) {
            return new Promise(r => {
                const reader = new FileReader();
                reader.onload = e => r(window.btoa(e.target.result));
                reader.readAsBinaryString(new Blob([data]));
            });
        }
        async function connect() {
            TOKEN = document.getElementById('token').value;
            try {
                const res = await fetch('https://api.github.com/user/repos?per_page=100', { headers: {'Authorization': `token ${TOKEN}`} });
                if(!res.ok) throw new Error("Token Invalid");
                const d = await res.json();
                document.getElementById('repoList').innerHTML = d.map(r => `<option value="${r.full_name}">${r.full_name}</option>`).join('');
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                writeLog("Connected!");
            } catch(e) { alert(e.message); }
        }
        async function startDeploy() {
            const repo = document.getElementById('repoList').value;
            const file = document.getElementById('zipInput').files[0];
            if(!file) return alert("Pilih ZIP!");
            const btn = document.getElementById('deployBtn'); btn.disabled = true;
            try {
                writeLog("Analyzing Repo & ZIP...");
                const repoRes = await fetch(`https://api.github.com/repos/${repo}`, { headers: {'Authorization': `token ${TOKEN}`} });
                const repoInfo = await repoRes.json();
                const branch = repoInfo.default_branch;
                
                const branchRes = await fetch(`https://api.github.com/repos/${repo}/branches/${branch}`, { headers: {'Authorization': `token ${TOKEN}`} });
                const branchInfo = await branchRes.json();
                const parentSha = branchInfo.commit.sha;
                
                const arrayBuffer = await file.arrayBuffer();
                const zip = await JSZip.loadAsync(arrayBuffer);
                const files = Object.keys(zip.files).filter(k => !zip.files[k].dir);
                
                // Smart Path Stripping Logic
                const firstFolder = files[0].split('/')[0];
                const isNested = files.every(f => f.startsWith(firstFolder + '/'));
                
                const tree = [];
                for(const f of files) {
                    writeLog("Uploading: " + f);
                    const content = await zip.files[f].async("uint8array");
                    const b64 = await getBase64(content);
                    const blobRes = await fetch(`https://api.github.com/repos/${repo}/git/blobs`, {
                        method: 'POST', headers: {'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json'},
                        body: JSON.stringify({ content: b64, encoding: 'base64' })
                    });
                    const blob = await blobRes.json();
                    
                    const githubPath = isNested ? f.substring(f.indexOf('/') + 1) : f;
                    if(!githubPath) continue;

                    tree.push({ path: githubPath, mode: "100644", type: "blob", sha: blob.sha });
                }
                
                writeLog("Creating Commit...");
                const treeRes = await fetch(`https://api.github.com/repos/${repo}/git/trees`, {
                    method: 'POST', headers: {'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify({ tree })
                });
                const newTree = await treeRes.json();
                
                const commitRes = await fetch(`https://api.github.com/repos/${repo}/git/commits`, {
                    method: 'POST', headers: {'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: "Nexu Deploy", tree: newTree.sha, parents: [parentSha] })
                });
                const commit = await commitRes.json();
                
                await fetch(`https://api.github.com/repos/${repo}/git/refs/heads/${branch}`, {
                    method: 'PATCH', headers: {'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify({ sha: commit.sha, force: true })
                });
                writeLog("SUCCESS!", "#3fb950");
                alert("Done!");
            } catch(e) { writeLog("ERROR: " + e.message, "#f85149"); }
            finally { btn.disabled = false; }
        }
    </script>
</body>
</html>
